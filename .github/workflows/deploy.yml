name: Deploy WorldDB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worlddb-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    env:
      WORLDDB_PORT: ${{ vars.WORLDDB_PORT || '4174' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy with rollback
        env:
          DEPLOY_ID: ${{ github.sha }}
        run: bash scripts/deploy-local.sh
